spring.application.name=CampusDay

spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/CampusDay}
spring.mongodb.database=${MONGODB_DATABASE:CampusDay}
spring.data.mongodb.auto-index-creation=true

server.address=0.0.0.0
server.port=${PORT:5783}
app.cors.allowed-origins=${FRONTEND_ORIGINS:http://localhost:4173,http://localhost:4174,http://localhost:4175,http://localhost:4176,http://127.0.0.1:4173,http://127.0.0.1:4174,http://127.0.0.1:4175,http://127.0.0.1:4176}
app.study.zone-id=${STUDY_ZONE_ID:Asia/Dhaka}
app.demo.seed-students=${DEMO_SEED_STUDENTS:true}
app.demo.seed-meal-management=${DEMO_SEED_MEAL_MANAGEMENT:true}

# Authentication. Replace every secret in deployed environments.
app.auth.jwt.issuer=${AUTH_JWT_ISSUER:campus-day}
app.auth.jwt.secret=${AUTH_JWT_SECRET:Y2FtcHVzLWRheS1sb2NhbC1kZXZlbG9wbWVudC1oczUxMi1zZWNyZXQtcmVwbGFjZS1pbi1wcm9kdWN0aW9uLTIwMjY=}
app.auth.jwt.access-token-ttl=${AUTH_ACCESS_TOKEN_TTL:PT15M}
app.auth.jwt.refresh-token-ttl=${AUTH_REFRESH_TOKEN_TTL:P30D}
app.auth.otp.ttl=${AUTH_OTP_TTL:PT10M}
app.auth.otp.resend-cooldown=${AUTH_OTP_RESEND_COOLDOWN:PT1M}
app.auth.otp.max-attempts=${AUTH_OTP_MAX_ATTEMPTS:5}
app.auth.otp.pepper=${AUTH_OTP_PEPPER:campus-day-local-otp-pepper-change-in-production}
app.auth.frontend-oauth-success-uri=${AUTH_FRONTEND_OAUTH_SUCCESS_URI:http://localhost:4173/auth/callback}
app.auth.frontend-oauth-failure-uri=${AUTH_FRONTEND_OAUTH_FAILURE_URI:http://localhost:4173/signin?oauth=failed}

# Brevo transactional email. Never expose this API key to the React application.
app.auth.brevo.api-key=${BREVO_API_KEY:}
app.auth.brevo.base-url=${BREVO_BASE_URL:https://api.brevo.com}
app.auth.brevo.sender-email=${BREVO_SENDER_EMAIL:}
app.auth.brevo.sender-name=${BREVO_SENDER_NAME:Campus Day}

# Meal Manager applications are reviewed from a one-time email link.
app.meal.manager-application.admin-email=${MEAL_MANAGER_ADMIN_EMAIL:}
app.meal.manager-application.frontend-base-url=${FRONTEND_BASE_URL:http://localhost:4173}
app.meal.manager-application.decision-ttl=${MEAL_MANAGER_APPLICATION_TTL:PT72H}
app.meal.manager-application.expiry-initial-delay=${MEAL_MANAGER_EXPIRY_INITIAL_DELAY:PT30S}
app.meal.manager-application.expiry-fixed-delay=${MEAL_MANAGER_EXPIRY_FIXED_DELAY:PT15M}

# Google Sign-In. Configure these standard Spring environment variables to enable it:
# SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID
# SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET
# Optional scope override: SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_SCOPE=openid,profile,email

# Master switch for every Career Prep API, import job, and MongoDB index task.
# Keep false while the feature is paused or not ready for public deployment.
app.career-prep.enabled=${CAREER_PREP_ENABLED:false}

# One-time, idempotent staging importer for the selected public GitHub BCS dataset.
# Keep disabled during normal application startup.
app.career-prep.import.sangbitdas.enabled=${BCS_SANGBITDAS_IMPORT_ENABLED:false}
app.career-prep.import.sangbitdas.path=${BCS_SANGBITDAS_DATASET_PATH:data/import/staging/sangbitdas-bcs-dataset/bcs_preliminary_question_bank.json}
app.career-prep.import.sangbitdas.batch-prefix=${BCS_SANGBITDAS_BATCH_PREFIX:sangbitdas-bcs-dataset-v1}

# One-time official-taxonomy seeding, conservative classification proposals,
# and answer-verification queue initialization. Keep disabled in normal startup.
app.career-prep.enrichment.enabled=${BCS_ENRICHMENT_ENABLED:false}
app.career-prep.enrichment.taxonomy-resource=data/bcs/bpsc-50-preliminary-taxonomy.json
app.career-prep.enrichment.rules-resource=data/bcs/bcs-classification-rules-v1.json

# One-time source discovery registry for NCTB and other official BCS references.
# This stores metadata only; document binaries stay outside MongoDB.
app.career-prep.knowledge.registry.enabled=${BCS_KNOWLEDGE_REGISTRY_ENABLED:false}
app.career-prep.knowledge.registry.resource=data/bcs/bcs-knowledge-source-registry-v1.json
app.career-prep.knowledge.sections.enabled=${BCS_KNOWLEDGE_SECTIONS_ENABLED:false}
app.career-prep.knowledge.sections.path=${BCS_KNOWLEDGE_SECTIONS_PATH:data/import/staging/knowledge/sections.json}
# Curated text only. Full PDFs stay in object storage and raw extraction stays in staging.
app.career-prep.knowledge.sections.max-import-file-bytes=${BCS_KNOWLEDGE_MAX_IMPORT_FILE_BYTES:26214400}
app.career-prep.knowledge.sections.max-sections-per-source=${BCS_KNOWLEDGE_MAX_SECTIONS_PER_SOURCE:500}
app.career-prep.knowledge.sections.max-section-characters=${BCS_KNOWLEDGE_MAX_SECTION_CHARACTERS:4500}
app.career-prep.knowledge.sections.max-section-utf8-bytes=${BCS_KNOWLEDGE_MAX_SECTION_UTF8_BYTES:16000}
app.career-prep.knowledge.sections.max-total-characters=${BCS_KNOWLEDGE_MAX_TOTAL_CHARACTERS:1500000}
app.career-prep.knowledge.sections.min-extraction-quality=${BCS_KNOWLEDGE_MIN_EXTRACTION_QUALITY:0.70}
app.career-prep.knowledge.sections.require-topic=${BCS_KNOWLEDGE_REQUIRE_TOPIC:true}
app.career-prep.knowledge.sections.reject-ocr-required=${BCS_KNOWLEDGE_REJECT_OCR_REQUIRED:true}

# Marketplace images are stored in Cloudinary. MongoDB stores asset metadata only.
app.marketplace.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
app.marketplace.cloudinary.api-key=${CLOUDINARY_API_KEY:}
app.marketplace.cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
app.marketplace.cloudinary.asset-folder=${CLOUDINARY_ASSET_FOLDER:campus-day/marketplace}
app.marketplace.cloudinary.max-file-size=${CLOUDINARY_MAX_FILE_SIZE:8MB}
# Student profile photos reuse the same Cloudinary account but use a separate folder.
app.student.profile-image.asset-folder=${CLOUDINARY_PROFILE_FOLDER:campus-day/profiles}
app.student.profile-image.max-file-size=${CLOUDINARY_PROFILE_MAX_FILE_SIZE:5MB}
spring.servlet.multipart.max-file-size=${MARKETPLACE_MAX_IMAGE_SIZE:8MB}
spring.servlet.multipart.max-request-size=${MARKETPLACE_MAX_UPLOAD_REQUEST_SIZE:40MB}

# Current Affairs uses NewsData.io only from the backend. Keep disabled until
# NEWSDATA_API_KEY is configured. Stored MongoDB content remains available when
# the provider is disabled or temporarily unavailable.
app.current-affairs.enabled=${CURRENT_AFFAIRS_ENABLED:false}
app.current-affairs.newsdata-api-key=${NEWSDATA_API_KEY:}
app.current-affairs.newsdata-base-url=${NEWSDATA_BASE_URL:https://newsdata.io}
app.current-affairs.country=${NEWSDATA_COUNTRY:bd}
app.current-affairs.languages=${NEWSDATA_LANGUAGES:bn,en}
app.current-affairs.page-size=${NEWSDATA_PAGE_SIZE:10}
app.current-affairs.schema-version=newsdata-latest-v1
app.current-affairs.import-initial-delay=${CURRENT_AFFAIRS_IMPORT_INITIAL_DELAY:PT30S}
app.current-affairs.import-fixed-delay=${CURRENT_AFFAIRS_IMPORT_FIXED_DELAY:PT1H}
app.current-affairs.cloudinary-mirroring-enabled=${CURRENT_AFFAIRS_CLOUDINARY_MIRRORING_ENABLED:false}
app.current-affairs.cloudinary-asset-folder=${CURRENT_AFFAIRS_CLOUDINARY_FOLDER:campus-day/current-affairs}
# Enable only after confirming that the provider/source grants image re-hosting rights.
app.current-affairs.source-rights-cleared=${CURRENT_AFFAIRS_SOURCE_RIGHTS_CLEARED:false}

# Google Calendar OAuth credentials are created in Google Cloud Console.
app.study.calendar.google.client-id=${GOOGLE_CALENDAR_CLIENT_ID:}
app.study.calendar.google.client-secret=${GOOGLE_CALENDAR_CLIENT_SECRET:}
app.study.calendar.google.redirect-uri=${GOOGLE_CALENDAR_REDIRECT_URI:http://localhost:5783/api/study/calendar/integrations/google/callback}
app.study.calendar.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth
app.study.calendar.google.token-uri=https://oauth2.googleapis.com/token
app.study.calendar.google.calendar-api-base-uri=https://www.googleapis.com/calendar/v3
app.study.calendar.integration.oauth-state-ttl=PT10M
app.study.calendar.integration.auto-sync-fixed-delay=${CALENDAR_AUTO_SYNC_FIXED_DELAY:PT15M}
app.study.calendar.integration.auto-sync-initial-delay=${CALENDAR_AUTO_SYNC_INITIAL_DELAY:PT30S}
# Replace this value in every deployed environment; changing it disconnects saved accounts.
app.study.calendar.integration.token-encryption-key=${CALENDAR_TOKEN_ENCRYPTION_KEY:campus-day-local-calendar-key-change-in-production}

# Taskbot uses Gemini first and automatically falls back to Groq through
# Spring AI. Provider keys stay on the backend, and the application remains
# startable when neither provider has been configured.
app.study.taskbot.api-key=${GEMINI_API_KEY:}
app.study.taskbot.model=${GEMINI_MODEL:gemini-3.8-flash}
app.study.taskbot.groq-api-key=${GROQ_API_KEY:}
app.study.taskbot.groq-base-url=${GROQ_BASE_URL:https://api.groq.com/openai/v1}
app.study.taskbot.groq-model=${GROQ_MODEL:qwen/qwen3.8-27b}
app.study.taskbot.temperature=${GEMINI_TEMPERATURE:0.2}
app.study.taskbot.max-output-tokens=${TASKBOT_MAX_OUTPUT_TOKENS:1536}
app.study.taskbot.requests-per-minute=${TASKBOT_REQUESTS_PER_MINUTE:10}
app.study.taskbot.max-context-tasks=${TASKBOT_MAX_CONTEXT_TASKS:16}
app.study.taskbot.max-topics-per-subject=${TASKBOT_MAX_TOPICS_PER_SUBJECT:8}
