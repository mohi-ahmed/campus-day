# Render exposes generated hostnames without a scheme. Compose the public URLs
# here because Blueprint YAML intentionally does not interpolate variables.
app.cors.allowed-origins=https://${FRONTEND_HOST}
app.auth.frontend-oauth-success-uri=https://${FRONTEND_HOST}/auth/callback
app.auth.frontend-oauth-failure-uri=https://${FRONTEND_HOST}/signin?oauth=failed
app.meal.manager-application.frontend-base-url=https://${FRONTEND_HOST}
app.study.calendar.google.redirect-uri=https://${BACKEND_HOST}/api/study/calendar/integrations/google/callback

# Trust Render's forwarding headers when the application creates redirects.
server.forward-headers-strategy=framework

# Production must not insert local demonstration records on startup.
app.demo.seed-students=false
app.demo.seed-meal-management=false
